# @package _global_
#
# Agilex empty-the-box，Fast-WAM (uncond) 变体，3 相机拼成 384x320。
# 模板来自 configs/task/robotwin_uncond_3cam_384_1e-4.yaml。
#
# batch_size / num_workers / max_steps 的取值由 Phase 5 探测确定，
# 见 AGILEX_TRAINING_PLAN.md 的实测数据表。命令行可覆盖。

defaults:
  - override /data: agilex_3cam
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 8            # A800 80G 保守起步；Phase 5c 探测后可调高
num_workers: 8           # 8 进程 x 8 = 64 workers + 8 主进程 = 72 < 80 核

model:
  mot_checkpoint_mixed_attn: false   # 必须保持 false：设 true 会被 mot.py:28-31 直接抛错
                                     # （本实现不支持梯度检查点）。OOM 请降 batch_size。

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: 20000         # 数据集长度按帧计（100 万帧），必须设上限；正式值 Phase 7 定
log_every: 10
save_every: 2000         # Phase 5b 量完 ckpt 体积后按磁盘预算调整
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
